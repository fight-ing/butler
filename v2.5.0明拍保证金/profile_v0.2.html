<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>中古优品 · 我的 v0.2 (买家版)</title>
<style>
  :root {
    --brand-900: #B34700; --brand-700: #E65100; --brand-500: #FF8000;
    --brand-400: #FFA526; --brand-300: #FFC300; --brand-200: #FFE082;
    --brand-100: #FFF8E1; --brand-50: #FFFBF0;
    --bg-page: #F4F5F6; --bg-card: #FFFFFF; --bg-subtle: #F8F8F6;
    --hero-bg: #FFFCF5;
    --border: rgba(0,0,0,0.03); --border-strong: rgba(0,0,0,0.06);
    --text-primary: #1A1A1A; --text-secondary: #6B6B6B; --text-tertiary: #9A9A9A;
    --live-red: #E53E3E; --live-red-bg: #FFF6F5;
    --anpai-orange: #FF8000; --anpai-orange-bg: #FFF8EF;
    --mingpai-deep: #E65100; --mingpai-deep-bg: #FFF6EC;
    --success: #2F855A; --success-bg: #EEF6F0;
    --warning: #C05621; --danger: #C53030; --info: #2B6CB0;
    --shadow-sm: none;
    --shadow-md: none;
    --shadow-lg: none;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    color: var(--text-primary); background: #F4F3EE; -webkit-font-smoothing: antialiased;
  }
  body { display: flex; justify-content: center; min-height: 100vh; padding: 0; }
  .phone {
    width: 375px; min-height: 812px;
    background: var(--bg-page);
    position: relative;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    border-radius: 24px; overflow: hidden;
    padding-bottom: 60px;
  }

  /* Status bar */
  .status-bar {
    height: 44px; padding: 0 20px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 15px; font-weight: 600;
    background: var(--hero-bg);
  }
  .status-bar .icons { display: flex; gap: 4px; font-size: 13px; }

  /* Top icon nav (右上角:扫码 / 客服 / 设置) */
  .top-nav {
    background: var(--hero-bg);
    padding: 6px 16px 4px;
    display: flex; justify-content: flex-end; gap: 18px;
  }
  .top-nav .ico {
    width: 22px; height: 22px;
    color: var(--text-primary);
  }
  .top-nav .ico svg { width: 22px; height: 22px; }

  /* Hero (用户区 — 浅黄背景,无渐变) */
  .hero {
    background: var(--hero-bg);
    padding: 12px 16px 22px;
    display: flex; align-items: center; gap: 14px;
  }
  .hero-avatar {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, #FFE0B2, #FFD180);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    color: #B66A1A;
  }
  .hero-avatar svg { width: 36px; height: 36px; }
  .hero-info { flex: 1; line-height: 1.4; min-width: 0; }
  .hero-name {
    font-size: 18px; font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 8px;
  }
  .hero-tags { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tag-credit {
    background: var(--success-bg);
    color: var(--success);
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 8px;
    font-weight: 600;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .tag-credit::before {
    content: '';
    width: 12px; height: 12px;
    background: var(--success);
    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'><path d='M22 11.08V12a10 10 0 1 1-5.93-9.14'/><polyline points='22 4 12 14.01 9 11.01' stroke='white' stroke-width='3' fill='none'/></svg>") center/contain no-repeat;
            mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'><circle cx='12' cy='12' r='10'/></svg>") center/contain no-repeat;
  }
  .tag-credit .arrow { color: var(--success); opacity: 0.5; font-size: 10px; }

  /* 4 宫格统计带 */
  .stats-4 {
    background: var(--bg-card);
    margin: -10px 12px 10px;
    border-radius: 8px;
    padding: 14px 0 12px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    box-shadow: var(--shadow-sm);
    position: relative;
    z-index: 2;
  }
  .s4 {
    text-align: center;
    border-right: 1px solid var(--border);
  }
  .s4:last-child { border-right: none; }
  .s4 .v {
    font-size: 22px; font-weight: 700;
    color: var(--text-primary);
    line-height: 1.1;
  }
  .s4 .l {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 6px;
  }

  /* 资产二宫格 */
  .assets {
    margin: 0 12px 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .asset-card {
    background: var(--bg-card);
    border-radius: 8px;
    border: 1px solid var(--border);
    padding: 10px 12px 9px;
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
  }
  .asset-card.deposit {
    background: linear-gradient(155deg, #FFFFFF 0%, #FFF8E1 100%);
    border-color: var(--brand-200);
  }
  .asset-card.ub {
    background: linear-gradient(155deg, #FFFFFF 0%, #FFF0E0 100%);
    border-color: #FFD0A8;
  }
  .asset-card::after {
    content: '';
    position: absolute;
    right: -25px; bottom: -25px;
    width: 70px; height: 70px;
    border-radius: 50%;
    background: rgba(255,128,0,0.05);
  }
  .asset-label {
    font-size: 12px;
    color: var(--text-secondary);
    display: flex; align-items: center; gap: 6px;
    font-weight: 500;
    position: relative; z-index: 1;
  }
  .asset-label .badge-ok {
    color: var(--success);
    background: var(--success-bg);
    font-size: 9px;
    padding: 1px 6px;
    border-radius: 6px;
    font-weight: 600;
  }
  .asset-value {
    font-size: 20px; font-weight: 700;
    margin-top: 3px;
    line-height: 1.1;
    position: relative; z-index: 1;
    letter-spacing: -0.5px;
  }
  .asset-card.deposit .asset-value { color: var(--brand-900); }
  .asset-card.deposit .asset-value::before {
    content: '¥'; font-size: 14px; font-weight: 600;
    margin-right: 2px; color: var(--brand-700);
  }
  .asset-card.ub .asset-value { color: var(--brand-900); }
  .asset-foot {
    font-size: 10.5px;
    color: var(--text-tertiary);
    margin-top: 4px;
    display: flex; align-items: center; justify-content: space-between;
    position: relative; z-index: 1;
  }
  .asset-cta {
    background: linear-gradient(135deg, var(--brand-300), var(--brand-500));
    color: var(--brand-900);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 6px;
    border: none;
    box-shadow: 0 2px 4px rgba(255,128,0,0.25);
    display: inline-flex; align-items: center; gap: 2px;
  }

  /* Section */
  .section { margin: 0 12px 12px; }
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 4px 8px;
  }
  .section-title {
    font-size: 15px; font-weight: 700;
    color: var(--text-primary);
  }
  .section-all {
    font-size: 12px;
    color: var(--text-tertiary);
  }
  .group {
    background: var(--bg-card);
    border-radius: 8px;
    border: 1px solid var(--border);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }

  /* 我的购买 4 列 */
  .order-row {
    padding: 14px 4px 12px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
  }
  .order-cell {
    text-align: center;
    position: relative;
  }
  .order-icon {
    width: 34px; height: 34px;
    margin: 0 auto 6px;
    display: flex; align-items: center; justify-content: center;
    color: var(--brand-500);
  }
  .order-icon svg { width: 30px; height: 30px; }
  .order-label {
    font-size: 12px;
    color: var(--text-primary);
  }
  .order-num {
    position: absolute;
    top: -2px; right: calc(50% - 30px);
    min-width: 16px; height: 16px;
    padding: 0 4px;
    background: var(--live-red);
    color: white;
    font-size: 10px; font-weight: 700;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    border: 1.5px solid var(--bg-card);
  }
  .order-num.warn { background: var(--brand-500); }
  .order-num.muted { background: var(--text-tertiary); }

  /* 我的竞拍卡(单一入口,样式精简) */
  .bid-entry {
    background: var(--bg-card);
    border-radius: 8px;
    border: 1px solid var(--border);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .bid-single {
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    position: relative;
  }
  .bs-icon {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--brand-300), var(--brand-500));
    color: white;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(255,128,0,0.22);
    position: relative;
  }
  .bs-icon svg { width: 18px; height: 18px; }
  .bs-icon .dot {
    position: absolute;
    top: -2px; right: -2px;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--danger);
    border: 2px solid var(--bg-card);
  }
  .bs-info { flex: 1; min-width: 0; line-height: 1.3; }
  .bs-pills {
    display: flex; gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .bs-pill {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    line-height: 1.4;
  }
  .bs-pill.mp {
    background: var(--mingpai-deep-bg);
    color: var(--mingpai-deep);
  }
  .bs-pill.ap {
    background: var(--anpai-orange-bg);
    color: var(--anpai-orange);
  }
  .bs-pill .n {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .bs-sub {
    font-size: 11px;
    color: var(--text-tertiary);
    margin-top: 4px;
  }
  .bs-arrow {
    flex-shrink: 0;
    display: flex; align-items: baseline; gap: 3px;
    font-size: 12px;
    color: var(--text-tertiary);
  }
  .bs-arrow .num {
    font-size: 22px;
    font-weight: 700;
    color: var(--brand-700);
    font-variant-numeric: tabular-nums;
    line-height: 1;
    letter-spacing: -0.5px;
  }
  .bs-arrow .chev {
    color: var(--text-tertiary);
    margin-left: 3px;
  }

  /* 我的购买:待付款副标"中拍 N"  */
  .order-cell { padding: 0 4px; position: relative; }
  .order-sub {
    font-size: 9.5px;
    color: var(--brand-700);
    font-weight: 600;
    margin-top: 2px;
    background: var(--brand-100);
    padding: 1px 6px;
    border-radius: 8px;
    display: inline-block;
    line-height: 1.3;
  }

  /* 拍卖工作台单卡入口(deprecated,保留 CSS 以防遗留引用) */
  .wb-entry {
    background: linear-gradient(135deg, #FFF8E1 0%, #FFF0E0 100%);
    border: 1px solid var(--brand-200);
    border-radius: 8px;
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    box-shadow: var(--shadow-sm);
    margin-bottom: 0;
  }
  .wb-icon {
    width: 42px; height: 42px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--brand-300), var(--brand-500));
    color: white;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(255,128,0,0.25);
  }
  .wb-icon svg { width: 22px; height: 22px; }
  .wb-info { flex: 1; line-height: 1.4; min-width: 0; }
  .wb-title {
    font-size: 15px; font-weight: 700;
    color: var(--text-primary);
  }
  .wb-sub {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  .wb-arrow {
    font-size: 12px;
    color: var(--brand-700);
    font-weight: 600;
    flex-shrink: 0;
  }
  .wb-arrow .num {
    background: var(--brand-700);
    color: white;
    min-width: 18px; height: 18px;
    padding: 0 6px;
    border-radius: 9px;
    font-size: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    margin-right: 4px;
  }

  /* 我的工具 grid */
  .tools-grid {
    padding: 16px 8px 12px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    row-gap: 18px;
  }
  .tool {
    text-align: center;
    position: relative;
  }
  .tool-icon {
    width: 32px; height: 32px;
    margin: 0 auto 6px;
    color: var(--text-primary);
    display: flex; align-items: center; justify-content: center;
  }
  .tool-icon svg { width: 26px; height: 26px; }
  .tool-label {
    font-size: 12px;
    color: var(--text-primary);
  }
  .tool .need-update {
    position: absolute;
    top: -6px; right: calc(50% - 30px);
    background: var(--live-red);
    color: white;
    font-size: 9px;
    padding: 1px 6px;
    border-radius: 8px;
    font-weight: 600;
    border: 1.5px solid var(--bg-card);
    white-space: nowrap;
  }

  /* Tab bar */
  .tabbar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 60px;
    background: var(--bg-card);
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    padding-bottom: 4px;
  }
  .tab {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 2px;
    color: var(--text-tertiary);
    position: relative;
  }
  .tab svg { width: 22px; height: 22px; }
  .tab-label { font-size: 10px; }
  .tab.active { color: var(--brand-500); font-weight: 600; }

  /* 待数据(暂不显示)标注块 */
  .pending-strip {
    margin: 0 12px 12px;
    background: var(--bg-subtle);
    border: 1px dashed var(--border-strong);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 11px;
    color: var(--text-tertiary);
    display: flex; align-items: center; gap: 8px;
  }
  .pending-strip .lbl {
    background: var(--bg-card);
    color: var(--text-secondary);
    padding: 2px 8px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 10px;
  }
</style>
</head>

      </div>
      <div class="bid-entry">
        <div class="bid-single">
          <div class="bs-icon">
            <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26"/></svg>
            <span class="dot"></span>
          </div>
          <div class="bs-info">
            <div class="bs-pills">
              <span class="bs-pill mp">明拍 <span class="n">3</span></span>
              <span class="bs-pill ap">暗拍 <span class="n">2</span></span>
            </div>
            <div class="bs-sub">含出价中 · 已收藏 · 即将结拍</div>
          </div>
          <div class="bs-arrow">
            <span class="num">5</span>
            <span>件</span>
            <span class="chev">›</span>
          </div>
        </div>
        <!-- 中拍提示(底部一行) -->
        <div style="padding:8px 14px;background:linear-gradient(95deg, #FFF4DC 0%, #FFEFC9 100%);border-top:1px solid var(--brand-200);display:flex;align-items:center;gap:7px;font-size:11.5px;color:#6B3A0E;line-height:1.5;">
          <svg style="width:13px;height:13px;flex-shrink:0;color:var(--brand-700);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="13" stroke-linecap="round"/><line x1="12" y1="16" x2="12.01" y2="16" stroke-linecap="round"/></svg>
          <span>中拍货品将<b style="color:var(--brand-900);">自动加入购物袋</b>,须手动下单付款</span>
        </div>
      </div>
    </div>

    <!-- 我的工具 -->
    <div class="section">
      <div class="section-head">
        <div class="section-title">我的工具</div>
      </div>
      <div class="group">
        <div class="tools-grid">
          <div class="tool">
            <div class="tool-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2 4 6v6c0 5 3.4 9.4 8 10 4.6-.6 8-5 8-10V6z"/><path d="M9 12l2 2 4-4"/></svg>
            </div>
            <div class="tool-label">实名认证</div>
            <span class="need-update">需更新</span>
          </div>
          <div class="tool">
            <div class="tool-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            </div>
            <div class="tool-label">地址管理</div>
          </div>
          <div class="tool">
            <div class="tool-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            </div>
            <div class="tool-label">意见反馈</div>
          </div>
          <div class="tool">
            <div class="tool-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            </div>
            <div class="tool-label">电话客服</div>
          </div>
          <div class="tool">
            <div class="tool-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            </div>
            <div class="tool-label">关于我们</div>
          </div>
          <div class="tool">
            <div class="tool-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
            </div>
            <div class="tool-label">邀请好友</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 待数据(暂不显示)标注: 用于设计稿提示 -->
    <div class="pending-strip">
      <span class="lbl">v1.5</span>
      <span>累计成交 / 累计交易额 / 履约率 暂不显示(等数据基础完善后再加,位置候选:顶部信用分右侧)</span>
    </div>

    <div style="height:8px;"></div>

    <!-- Tab bar -->
    <div class="tabbar">
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12L12 3l9 9"/><path d="M5 10v10h14V10"/></svg>
        <span class="tab-label">主页</span>
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M12 3c-3 5-7 7-7 12a7 7 0 0 0 14 0c0-5-4-7-7-12z"/></svg>
        <span class="tab-label">热销</span>
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span class="tab-label">购物袋</span>
      </div>
      <div class="tab active">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/><circle cx="9" cy="10" r="1.2" fill="white"/><circle cx="15" cy="10" r="1.2" fill="white"/><path d="M8.5 14.5C9.5 16 10.7 16.5 12 16.5s2.5-.5 3.5-2" stroke="white" stroke-width="1.5" fill="none"/></svg>
        <span class="tab-label">我的</span>
      </div>
    </div>

  </div>
<script src="_shell-hook.js"></script>
</body>
</html>
