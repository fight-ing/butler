<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>中古优品 · 补交保证金 v0.3</title>
<style>
  :root {
    --brand-700: #E65100; --brand-500: #FF8000;
    --brand-300: #FFC300; --brand-200: #FFE082;
    --brand-100: #FFF8E1; --brand-50: #FFFBF0;
    --bg-page: #F4F5F6; --bg-card: #FFFFFF; --bg-subtle: #F8F8F6;
    --border: rgba(0,0,0,0.04); --border-strong: rgba(0,0,0,0.07);
    --text-primary: #1A1A1A; --text-secondary: #6B6B6B; --text-tertiary: #9A9A9A;
    --success: #2F855A; --success-bg: #EEF6F0;
    --warning: #C05621; --warning-bg: #FFF8EF;
    --danger: #DC2626; --danger-bg: #FFF6F5;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    color: var(--text-primary); background: #EEE;
    -webkit-font-smoothing: antialiased;
  }
  body { display: flex; justify-content: center; min-height: 100vh; }
  .phone {
    width: 375px; min-height: 812px;
    background: var(--bg-page);
    position: relative;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    border-radius: 24px; overflow: hidden;
    padding-bottom: 72px;
  }
  .status-bar {
    height: 44px; padding: 0 20px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 15px; font-weight: 600;
    background: var(--bg-card);
  }
  .status-bar .icons { display: flex; gap: 4px; font-size: 13px; }
  .navbar {
    height: 44px; padding: 0 16px;
    display: flex; align-items: center; gap: 12px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
  }
  .nav-back {
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    margin-left: -4px;
  }
  .nav-back svg { width: 22px; height: 22px; }
  .nav-title {
    flex: 1; text-align: center;
    font-size: 17px; font-weight: 600;
    margin-right: 28px;
  }

  /* Hero 余额卡 */
  .hero {
    margin: 12px;
    background: linear-gradient(135deg, #FFC300 0%, #FF8000 55%, #E65100 100%);
    border-radius: 12px;
    padding: 20px 20px 18px;
    color: white;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(255,128,0,0.20);
  }
  .hero::after {
    content: ''; position: absolute;
    right: -40px; top: -30px;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
  }
  .hero::before {
    content: ''; position: absolute;
    left: -30px; bottom: -40px;
    width: 130px; height: 130px;
    border-radius: 50%;
    background: rgba(255,255,255,0.07);
  }
  .hero-label {
    position: relative; z-index: 1;
    font-size: 12px;
    color: rgba(255,255,255,0.88);
    display: flex; align-items: center; gap: 8px;
  }
  .hero-label .std {
    background: rgba(255,255,255,0.16);
    color: rgba(255,255,255,0.85);
    padding: 1px 7px;
    border-radius: 3px;
    font-size: 10.5px;
  }
  .hero-balance {
    position: relative; z-index: 1;
    font-size: 36px;
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -0.5px;
    margin: 6px 0 2px;
    font-variant-numeric: tabular-nums;
  }
  .hero-balance::before {
    content: '¥';
    font-size: 18px;
    font-weight: 500;
    margin-right: 3px;
    opacity: 0.95;
    vertical-align: 4px;
  }
  .hero-gap {
    position: relative; z-index: 1;
    margin-top: 4px;
    font-size: 12px;
    color: rgba(255,255,255,0.88);
  }
  .hero-gap b {
    background: rgba(255,255,255,0.20);
    padding: 2px 8px;
    border-radius: 4px;
    margin-left: 4px;
    font-weight: 700;
  }

  /* 状态提示 */
  .status-strip {
    margin: 0 12px 12px;
    background: var(--warning-bg);
    border: 1px solid #FCD9A8;
    border-radius: 6px;
    padding: 9px 12px;
    font-size: 12px;
    color: #8B5A1F;
    line-height: 1.5;
    display: flex; align-items: flex-start; gap: 8px;
  }
  .status-strip svg {
    width: 14px; height: 14px;
    color: var(--warning);
    flex-shrink: 0;
    margin-top: 1px;
  }
  .status-strip b { color: var(--warning); font-weight: 700; }

  /* 补交金额 选择卡 */
  .amount-card {
    margin: 0 12px 12px;
    background: var(--bg-card);
    border-radius: 8px;
    padding: 16px;
  }
  .amount-title {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 8px;
    font-weight: 500;
    display: flex; align-items: center;
  }
  .amount-display {
    display: flex; align-items: baseline; gap: 4px;
    margin-bottom: 4px;
  }
  .amount-display .yen {
    font-size: 18px;
    font-weight: 600;
    color: var(--brand-700);
  }
  .amount-display .v {
    font-size: 36px;
    font-weight: 700;
    color: var(--brand-900);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
  }
  .amount-display .v::after {
    content: '.00';
    font-size: 18px;
    font-weight: 500;
    color: var(--text-tertiary);
    margin-left: 1px;
  }
  .amount-presets {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .preset-chip {
    text-align: center;
    padding: 9px 0;
    background: var(--bg-page);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    font-size: 13px;
    color: var(--text-secondary);
    cursor: pointer;
  }
  .preset-chip.active {
    background: linear-gradient(135deg, var(--brand-300), var(--brand-500));
    color: var(--brand-900);
    border-color: var(--brand-500);
    font-weight: 700;
  }

  /* 说明 */
  .info-card {
    margin: 0 12px 12px;
    background: var(--bg-card);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.6;
  }
  .info-card b { color: var(--text-primary); font-weight: 600; }
  .info-card .item {
    display: flex; align-items: flex-start; gap: 6px;
    padding: 4px 0;
  }
  .info-card .item::before {
    content: '·';
    color: var(--brand-700);
    font-weight: 700;
    flex-shrink: 0;
  }

  .link { color: var(--brand-700); text-decoration: none; }

  /* 同意勾选 */
  .agree-row {
    margin: 0 12px 80px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--bg-card);
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid var(--border);
  }
  .agree-box {
    flex-shrink: 0;
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 1.5px solid #C8C8C8;
    background: white;
    display: flex; align-items: center; justify-content: center;
    color: white;
    transition: all .15s;
  }
  .agree-box svg { width: 11px; height: 11px; opacity: 0; }
  .agree-row.checked .agree-box {
    background: var(--brand-500);
    border-color: var(--brand-500);
  }
  .agree-row.checked .agree-box svg { opacity: 1; }
  .agree-text {
    font-size: 12.5px;
    color: var(--text-secondary);
    line-height: 1.5;
  }

  /* Sticky footer */
  .footer {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: var(--bg-card);
    border-top: 1px solid var(--border);
    padding: 11px 14px 20px;
    display: flex; align-items: center; gap: 12px;
  }
  .footer-info { flex: 1; line-height: 1.3; }
  .footer-info .lbl {
    font-size: 11px;
    color: var(--text-tertiary);
  }
  .footer-info .amt {
    font-size: 20px;
    font-weight: 700;
    color: var(--brand-700);
    font-variant-numeric: tabular-nums;
  }
  .footer-info .amt::before {
    content: '¥';
    font-size: 13px;
    font-weight: 600;
    margin-right: 1px;
  }
  .submit-btn {
    flex-shrink: 0;
    padding: 13px 26px;
    background: linear-gradient(135deg, var(--brand-500), var(--brand-700));
    color: white;
    border: none;
    border-radius: 22px;
    font-size: 15px;
    font-weight: 700;
    box-shadow: 0 4px 12px rgba(230,81,0,0.30);
    cursor: pointer;
    transition: opacity .15s;
  }
  .submit-btn.disabled,
  .submit-btn[disabled] {
    background: #C8C8C8;
    box-shadow: none;
    cursor: not-allowed;
    opacity: 1;
  }
</style>
</head>
<body>
  <div class="phone">

    <div class="status-bar">
      <span>9:41</span>
      <div class="icons"><span>●●●●●</span><span style="margin-left:6px;">📶</span><span>🔋</span></div>
    </div>

    <div class="navbar">
      <div class="nav-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </div>
      <div class="nav-title">补交保证金</div>
    </div>

    <!-- Hero 余额卡 -->
    <div class="hero">
      <div class="hero-label">
        <span>当前保证金余额</span>
        <span class="std">标准额 ¥3,000</span>
      </div>
      <div class="hero-balance">2,500.00</div>
      <div class="hero-gap">
        距标准额还差 <b>¥ 500</b>
      </div>
    </div>

    <!-- 状态提示 -->
    <div class="status-strip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span><b>保证金低于标准额度,部分功能受限</b>。补足至 ¥3,000 后即可恢复。</span>
    </div>

    <!-- 补交金额(系统自动计算 = 标准额 - 当前余额;不支持编辑,不可超出) -->
    <div class="amount-card">
      <div class="amount-title">
        补交金额
        <span style="margin-left:auto;font-size:11px;color:var(--text-tertiary);font-weight:400;">系统自动计算 · 不可编辑</span>
      </div>
      <div class="amount-display">
        <span class="yen">¥</span>
        <span class="v">500</span>
      </div>
      <div style="margin-top:6px;font-size:12px;color:var(--text-secondary);line-height:1.6;">
        = 标准额 <b style="color:var(--text-primary);">¥3,000</b> − 当前余额 <b style="color:var(--text-primary);">¥2,500</b>
      </div>
      <div style="margin-top:10px;padding:8px 10px;background:var(--warning-bg);border-left:3px solid var(--warning);border-radius:4px;font-size:11.5px;color:#8B5A1F;line-height:1.5;">
        <b>只能补足至标准额 ¥3,000</b>,<b>不支持超额充值</b>。
      </div>
    </div>

    <!-- 同意勾选 -->
    <div class="agree-row" id="agreeRow">
      <span class="agree-box" id="agreeBox">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="3 8 7 12 13 4"/></svg>
      </span>
      <span class="agree-text">我已阅读并同意 <a href="#" class="link">《中古优品保证金协议》</a></span>
    </div>

    <!-- Sticky footer -->
    <div class="footer">
      <div class="footer-info">
        <div class="lbl">本次补交</div>
        <div class="amt">500.00</div>
      </div>
      <button class="submit-btn disabled" id="submitBtn" disabled>立即补交</button>
    </div>

  </div>
<script>
  (function() {
    const row = document.getElementById('agreeRow');
    const btn = document.getElementById('submitBtn');
    let checked = false;
    function render() {
      row.classList.toggle('checked', checked);
      btn.disabled = !checked;
      btn.classList.toggle('disabled', !checked);
    }
    row.addEventListener('click', (e) => {
      // 点链接不切换勾选
      if (e.target.tagName === 'A') return;
      checked = !checked;
      render();
    });
    render();
  })();
</script>
<script src="_shell-hook.js"></script>
</body>
</html>
