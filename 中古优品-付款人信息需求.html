<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中古优品 ERP · 支付真实姓名校验 综合演示</title>
<style>
:root {
  --brand: #1677FF; --brand-hover: #4096FF;
  --brand-bg: #E6F4FF; --brand-bg-active: #BAE0FF;
  --orange: #FF4400; --orange-bg: #FFF1E8;
  --text-1: #262626; --text-2: #595959; --text-3: #8C8C8C; --text-4: #BFBFBF;
  --border: #F0F0F0; --border-2: #D9D9D9;
  --bg-page: #F5F5F5; --bg-card: #FFFFFF; --bg-hover: #FAFAFA;
  --bg-table-head: #FAFAFA; --bg-secondary: #F7F8FA;
  --error: #FF4D4F; --error-bg: #FFF1F0;
  --warning: #FAAD14; --warning-bg: #FFFBE6;
  --success: #52C41A; --success-bg: #F6FFED;
  --gold: #D4B106; --gold-bg: #FFFBE6;
  --purple: #722ED1; --purple-bg: #F9F0FF;
  --radius-sm: 2px; --radius-md: 4px; --radius-lg: 6px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.03);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
}
* { box-sizing: border-box; }
body {
  margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  font-size: 13px; color: var(--text-1); background: var(--bg-page); line-height: 1.5715;
}

/* ========= 顶栏 ========= */
.topbar {
  height: 56px; background: var(--bg-card);
  display: flex; align-items: center;
  padding: 0 24px;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
}
.topbar-logo { font-weight: 600; font-size: 16px; margin-right: 32px; display: flex; align-items: center; gap: 8px; }
.topbar-logo-icon {
  width: 28px; height: 28px;
  background: var(--brand); color: white;
  border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px;
}
.topbar-divider { color: var(--border-2); margin: 0 12px; }
.topbar-shop { color: var(--text-2); font-size: 13px; }
.topbar-spacer { flex: 1; }
.topbar-user { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: var(--radius-md); cursor: pointer; }
.topbar-user:hover { background: var(--bg-hover); }
.topbar-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: linear-gradient(135deg, var(--brand), #4096FF);
  color: white; display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600;
}
.topbar-username { font-size: 13px; color: var(--text-2); }

/* ========= 主体两栏 ========= */
.layout { display: flex; min-height: calc(100vh - 56px); }

/* 侧栏 */
.sidebar { width: 208px; background: var(--bg-card); border-right: 1px solid var(--border); flex-shrink: 0; padding: 16px 0; }
.menu-section { margin-bottom: 4px; }
.menu-header {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 24px; color: var(--text-1); font-size: 13px; font-weight: 600;
  cursor: pointer; user-select: none;
}
.menu-header:hover { background: var(--bg-hover); }
.menu-header-icon { width: 16px; height: 16px; color: var(--brand); display: flex; align-items: center; justify-content: center; }
.menu-header-text { flex: 1; }
.menu-header-arrow { font-size: 9px; color: var(--text-3); transition: transform 0.2s; }
.menu-section.collapsed .menu-header-arrow { transform: rotate(-90deg); }
.menu-children { display: flex; flex-direction: column; padding: 2px 0 6px; }
.menu-section.collapsed .menu-children { display: none; }
.menu-child {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 24px 8px 50px;
  color: var(--text-2); cursor: pointer; font-size: 13px;
  position: relative; transition: all 0.15s;
}
.menu-child:hover { color: var(--text-1); background: var(--bg-hover); }
.menu-child.active { color: var(--brand); background: var(--brand-bg); font-weight: 500; }
.menu-child.active::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--brand); }
.menu-child-icon { width: 14px; height: 14px; opacity: 0.7; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.menu-child.active .menu-child-icon { opacity: 1; }
.menu-child-text { flex: 1; }
.menu-child-badge {
  background: var(--error); color: white;
  font-size: 11px; font-weight: 500;
  padding: 0 6px; border-radius: 10px; min-width: 18px;
  text-align: center; line-height: 16px; height: 16px;
}

/* 主内容 */
.content { flex: 1; padding: 16px 24px; overflow-x: auto; }

/* 面包屑 */
.breadcrumb { font-size: 13px; color: var(--text-3); margin-bottom: 12px; }
.breadcrumb a { color: var(--text-3); cursor: pointer; }
.breadcrumb a:hover { color: var(--brand); }
.breadcrumb .sep { margin: 0 6px; color: var(--text-4); }
.breadcrumb .current { color: var(--text-1); }

/* 页面标题区 */
.page-header {
  background: var(--bg-card); padding: 16px 24px;
  border-radius: var(--radius-md); margin-bottom: 16px;
  display: flex; align-items: center; justify-content: space-between;
}
.page-title { font-size: 18px; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 10px; }
.page-subtitle { color: var(--text-3); font-size: 13px; margin-top: 4px; }

/* ========= 数据汇总卡片(渐变背景图 1 风格)========= */
.summary-cards {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; margin-bottom: 16px;
}
.summary-cards.cols-4 { grid-template-columns: repeat(4, 1fr); }
.summary-cards.cols-5 { grid-template-columns: repeat(5, 1fr); }
.summary-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px 18px;
  display: flex; align-items: flex-start; gap: 12px;
  position: relative;
  transition: all 0.2s;
}
.summary-card.active {
  border-color: var(--brand);
  box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.08);
}
.summary-card-icon-lg {
  width: 44px; height: 44px;
  border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}
.summary-card-icon-lg.blue { background: var(--brand-bg); color: var(--brand); }
.summary-card-icon-lg.pink { background: #FFF0F6; color: #EB2F96; }
.summary-card-icon-lg.green { background: var(--success-bg); color: var(--success); }
.summary-card-icon-lg.orange { background: var(--orange-bg); color: var(--orange); }
.summary-card-icon-lg.brand { background: var(--brand-bg); color: var(--brand); }
.summary-card-icon-lg.purple { background: var(--purple-bg); color: var(--purple); }
.summary-card-icon-lg.red { background: var(--error-bg); color: var(--error); }
.summary-card-body { flex: 1; min-width: 0; }
.summary-card-value {
  font-size: 22px; font-weight: 600;
  font-family: -apple-system, 'Helvetica Neue', sans-serif;
  color: var(--text-1); line-height: 1.2;
}
.summary-card-label { font-size: 12px; color: var(--text-3); margin-top: 4px; }
.summary-card-extra { font-size: 11px; color: var(--text-3); margin-top: 4px; }
.summary-card-extra .up { color: var(--error); }
.summary-card-extra .down { color: var(--success); }

/* 卡片 */
.card { background: var(--bg-card); border-radius: var(--radius-md); padding: 16px 20px; margin-bottom: 16px; }
.card-title {
  font-size: 14px; font-weight: 600; margin: 0 0 16px;
  display: flex; align-items: center; gap: 8px;
}

/* 标签 */
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 1px 8px; border-radius: var(--radius-sm);
  font-size: 12px; line-height: 18px;
  border: 1px solid transparent;
}
.tag-warning { background: var(--warning-bg); color: var(--warning); border-color: #FFE58F; }
.tag-error { background: var(--error-bg); color: var(--error); border-color: #FFCCC7; }
.tag-success { background: var(--success-bg); color: var(--success); border-color: #B7EB8F; }
.tag-brand { background: var(--brand-bg); color: var(--brand); border-color: #91CAFF; }
.tag-default { background: var(--bg-hover); color: var(--text-2); border-color: var(--border); }
.tag-gold { background: #FFFBE6; color: var(--gold); border-color: #FFE58F; }
.tag-purple { background: var(--purple-bg); color: var(--purple); border-color: #D3ADF7; }

/* 高级筛选区 */
.filter-bar {
  background: var(--bg-card); padding: 16px 20px;
  border-radius: var(--radius-md); margin-bottom: 16px;
}
.filter-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 16px; }
.filter-item { display: flex; align-items: center; gap: 8px; }
.filter-item-label { font-size: 13px; color: var(--text-2); flex-shrink: 0; width: 80px; text-align: right; }
.filter-item input, .filter-item select {
  flex: 1; padding: 5px 11px;
  border: 1px solid var(--border-2);
  border-radius: var(--radius-md);
  font-size: 13px; outline: none; font-family: inherit;
}
.filter-item input:focus, .filter-item select:focus {
  border-color: var(--brand); box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.1);
}
.filter-actions {
  display: flex; gap: 8px; justify-content: flex-end;
  margin-top: 12px; padding-top: 12px;
  border-top: 1px solid var(--border);
}

/* 列表 toolbar(状态 Tab 横排,带蓝色下划线)*/
.list-toolbar-tabs {
  display: flex; gap: 0; align-items: center;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.tab-item {
  padding: 8px 16px;
  cursor: pointer; font-size: 14px;
  color: var(--text-2);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  display: flex; align-items: center; gap: 6px;
  transition: all 0.15s;
}
.tab-item:hover { color: var(--text-1); }
.tab-item.active { color: var(--brand); border-bottom-color: var(--brand); font-weight: 500; }
.tab-item .num {
  display: inline-block; padding: 0 6px;
  font-size: 11px; font-weight: 500;
  background: var(--bg-hover); color: var(--text-3);
  border-radius: 10px; line-height: 16px;
}
.tab-item.active .num { background: var(--brand-bg); color: var(--brand); }

/* 已挂起 tab 特殊样式 - 红色突出(紧跟在"已取消"后面)*/
.tab-item.tab-held { color: var(--error); }
.tab-item.tab-held:hover { color: var(--error); }
.tab-item.tab-held.active { color: var(--error); border-bottom-color: var(--error); }
.tab-item.tab-held .num { background: var(--error-bg); color: var(--error); }
.tab-item.tab-held.active .num { background: var(--error); color: white; }

/* 列表统计条(冷色渐变,贴近图 1 蓝色总览)*/
.list-summary-strip {
  background: linear-gradient(90deg, #F0F7FF, #E6F4FF);
  border-radius: var(--radius-md);
  padding: 10px 16px;
  margin-bottom: 12px;
  font-size: 13px; color: var(--text-2);
  display: flex; align-items: center; gap: 24px;
}
.list-summary-strip strong { color: var(--brand); font-weight: 600; font-family: -apple-system; font-size: 14px; }

/* 表格 */
table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th {
  background: var(--bg-table-head);
  color: var(--text-2); font-weight: 500; font-size: 13px;
  padding: 10px 12px; text-align: left;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.data-table td {
  padding: 14px 12px; border-bottom: 1px solid var(--border);
  vertical-align: top;
}
.data-table tr:hover td { background: #FAFCFF; }

/* 订单号列(蓝字 + 拷贝图标 + 子项展开)*/
.order-no-cell { display: flex; align-items: center; gap: 4px; }
.order-no-link { color: var(--brand); cursor: pointer; font-family: 'SF Mono', Consolas, monospace; }
.order-no-link:hover { text-decoration: underline; }
.copy-icon { color: var(--text-3); cursor: pointer; font-size: 12px; }
.copy-icon:hover { color: var(--brand); }

/* 商品信息列 */
.product-info-cell { display: flex; align-items: flex-start; gap: 10px; min-width: 220px; }
.product-img-sm {
  width: 56px; height: 56px;
  border-radius: var(--radius-sm); flex-shrink: 0;
  background: linear-gradient(135deg, #F0F1F2, #DCDFE3);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; color: var(--text-3);
  border: 1px solid var(--border);
}
.product-info-text { flex: 1; min-width: 0; font-size: 12px; line-height: 1.6; }
.product-info-text .label { color: var(--text-3); }
.product-info-text .value { color: var(--text-1); }
.product-name-line { display: flex; gap: 6px; margin-bottom: 2px; }
.expand-products {
  display: inline-flex; align-items: center; gap: 4px;
  margin-top: 4px;
  color: var(--brand); font-size: 12px; cursor: pointer;
}
.expand-products:hover { text-decoration: underline; }
.multi-products-count {
  display: inline-block; padding: 0 6px;
  background: var(--brand); color: white;
  border-radius: 8px; font-size: 11px; line-height: 16px;
  margin-left: 4px;
}

/* 金额信息列 */
.amount-info-cell { font-size: 12px; line-height: 1.7; min-width: 130px; }
.amount-info-cell .label { color: var(--text-3); }
.amount-info-cell .value { color: var(--text-1); font-family: 'SF Mono', Consolas, monospace; }

/* 操作列 */
.btn-link {
  color: var(--brand); cursor: pointer; font-size: 13px;
  background: none; border: none; padding: 0; font-family: inherit;
}
.btn-link:hover { color: var(--brand-hover); }
.btn-link.error { color: var(--error); font-weight: 500; }
.btn-link.danger { color: var(--error); }
.op-actions { display: flex; flex-direction: column; gap: 4px; min-width: 80px; }

/* 挂起标识(订单状态格内的小徽章)*/
.held-mark {
  display: inline-flex; align-items: center; gap: 2px;
  margin-top: 4px;
  padding: 0 6px;
  background: var(--error-bg); color: var(--error);
  border: 1px solid #FFCCC7;
  border-radius: var(--radius-sm);
  font-size: 11px; font-weight: 500;
  line-height: 16px;
}

/* 订单状态格(状态 tag + 挂起标识 垂直排列)*/
.status-cell { display: flex; flex-direction: column; align-items: flex-start; gap: 0; }

/* 子表格(展开商品/多件商品)*/
.sub-table-row { background: var(--bg-secondary); }
.sub-table-row > td { padding: 12px 16px 16px; border-top: 1px dashed var(--border); }
.sub-table {
  width: 100%; border-collapse: collapse; font-size: 12px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
}
.sub-table th {
  background: #F5F8FB; color: var(--text-2);
  padding: 8px 10px; font-weight: 500;
  border-bottom: 1px solid var(--border);
}
.sub-table td {
  padding: 10px; border-bottom: 1px solid var(--border);
}
.sub-table tr:last-child td { border-bottom: none; }

/* 列表底部分页 */
.list-footer {
  display: flex; align-items: center; justify-content: space-between;
  padding-top: 12px; margin-top: 12px;
  border-top: 1px solid var(--border);
}
.batch-actions { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-3); }
.pagination { display: flex; align-items: center; gap: 4px; font-size: 13px; }
.page-btn {
  padding: 4px 10px; border: 1px solid var(--border-2);
  border-radius: var(--radius-md); cursor: pointer; background: var(--bg-card);
  color: var(--text-2); font-size: 13px; min-width: 32px; text-align: center;
}
.page-btn:hover { border-color: var(--brand); color: var(--brand); }
.page-btn.active { background: var(--brand); color: white; border-color: var(--brand); }

/* mono */
.mono { font-family: 'SF Mono', Consolas, monospace; font-size: 12px; }

/* 按钮 */
.btn {
  padding: 5px 16px; border-radius: var(--radius-md);
  font-size: 13px; cursor: pointer;
  border: 1px solid var(--border-2);
  background: var(--bg-card); color: var(--text-1);
  font-family: inherit; transition: all 0.2s; height: 32px;
}
.btn:hover { border-color: var(--brand); color: var(--brand); }
.btn.primary { background: var(--brand); color: white; border-color: var(--brand); }
.btn.primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); color: white; }
.btn.danger { background: var(--error); color: white; border-color: var(--error); }
.btn.danger:hover { background: #FF7875; border-color: #FF7875; color: white; }
.btn.sm { padding: 2px 10px; height: 26px; font-size: 12px; }

.btn-text-row { display: flex; gap: 8px; align-items: center; }
.btn-text-row > .op-divider { width: 1px; height: 12px; background: var(--border-2); }

.search-input {
  padding: 5px 10px;
  border: 1px solid var(--border-2);
  border-radius: var(--radius-md);
  font-size: 13px; width: 240px; outline: none;
}
.search-input:focus { border-color: var(--brand); }

/* Modal */
.modal-mask {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.45);
  display: none; align-items: center; justify-content: center;
  z-index: 200;
}
.modal-mask.show { display: flex; }
.modal {
  background: var(--bg-card); border-radius: var(--radius-md);
  width: 480px; max-width: 90vw; max-height: 80vh; overflow-y: auto;
  box-shadow: 0 6px 16px rgba(0,0,0,0.08), 0 9px 28px 8px rgba(0,0,0,0.05);
}
.modal-header {
  padding: 16px 24px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.modal-title { font-size: 16px; font-weight: 600; }
.modal-close { cursor: pointer; color: var(--text-3); font-size: 16px; padding: 4px; background: none; border: none; }
.modal-close:hover { color: var(--text-1); }
.modal-body { padding: 20px 24px; }
.modal-footer {
  padding: 12px 24px; border-top: 1px solid var(--border);
  display: flex; gap: 8px; justify-content: flex-end;
}
.fund-meta { background: var(--bg-secondary); border-radius: var(--radius-md); padding: 12px 16px; margin-bottom: 16px; }
.fund-meta-row { display: flex; padding: 4px 0; font-size: 13px; }
.fund-meta-label { color: var(--text-3); width: 80px; }
.fund-meta-value { flex: 1; color: var(--text-1); }
.fund-meta-amount { font-size: 18px; font-weight: 600; color: var(--orange); font-family: -apple-system, sans-serif; }
.form-row { margin-bottom: 16px; }
.form-label { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 6px; font-weight: 400; }
.form-label .required { color: var(--error); margin-right: 4px; }
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 5px 11px;
  border: 1px solid var(--border-2);
  border-radius: var(--radius-md);
  font-size: 13px; color: var(--text-1);
  font-family: inherit; outline: none; transition: all 0.2s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--brand); box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.1);
}
.form-textarea { resize: vertical; min-height: 80px; padding: 8px 11px; }
.alert {
  padding: 10px 14px; border-radius: var(--radius-md);
  margin-bottom: 16px; font-size: 13px; line-height: 1.6;
  border: 1px solid;
}
.alert.error { background: var(--error-bg); color: var(--text-1); border-color: #FFCCC7; }
.alert.error strong { color: var(--error); }
.alert.warning { background: var(--warning-bg); color: var(--text-1); border-color: #FFE58F; }
.alert.brand { background: var(--brand-bg); color: var(--text-1); border-color: #91CAFF; }
.alert.brand strong { color: var(--brand); }

/* Toast */
.toast {
  position: fixed; top: 80px; left: 50%;
  transform: translateX(-50%);
  background: var(--text-1); color: white;
  padding: 8px 16px; border-radius: var(--radius-md);
  font-size: 13px; z-index: 300; display: none;
  box-shadow: var(--shadow-md);
}
.toast.show { display: block; animation: fadein 0.3s; }
@keyframes fadein {
  from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
.toast.success { background: var(--success); }
.toast.error { background: var(--error); }

.demo-page { display: none; }
.demo-page.active { display: block; }

.back-link {
  font-size: 13px; color: var(--brand); cursor: pointer;
  margin-bottom: 12px; display: inline-flex; align-items: center; gap: 4px;
}
.back-link:hover { color: var(--brand-hover); }

/* 详情通用 */
.detail-status-bar {
  background: var(--bg-card); padding: 16px 20px;
  border-radius: var(--radius-md);
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px;
}
.detail-status-info { display: flex; align-items: center; gap: 12px; }
.detail-status-text { font-size: 18px; font-weight: 600; color: var(--text-1); }
.detail-status-time { color: var(--text-3); font-size: 13px; }
.detail-amount {
  font-family: -apple-system, sans-serif;
  font-weight: 600; font-size: 22px; color: var(--orange);
}

.held-banner {
  background: var(--error-bg); border: 1px solid #FFCCC7;
  border-left: 3px solid var(--error);

function showToast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (type || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 3000);
}

function setActiveMenu(menuId) {
  document.querySelectorAll('.menu-child').forEach(m => m.classList.remove('active'));
  if (menuId) document.getElementById(menuId)?.classList.add('active');
}

  const content = document.getElementById('content');
  if (PAGES[page]) {

    if (page.startsWith('orders')) setActiveMenu('menu-orders');
    else if (page.startsWith('funds')) setActiveMenu('menu-funds');

    if (window.afterPageRender) window.afterPageRender(page);

function renderLogTab(o) {
  const heldPayments = o.heldPayments || (o.held && o.heldAmount ? [{
    payNo: 'PAY-001', amount: o.heldAmount, reason: o.heldReason,
    createdAt: (o.orderTime.split(' ')[0]) + ' 11:37:52',
    paidAt: (o.orderTime.split(' ')[0]) + ' 13:35:18',
  }] : []);

  // 倒序排列日志:最近的事件在上
  const events = [];
  // 挂起事件(倒序)
  heldPayments.forEach(p => {
    events.push({
      time: p.paidAt + ':42',
      type: 'held',
      title: '⚠️ 付款单挂起',
      desc: `系统 · 付款单 <span class="mono">${p.payNo}</span> 自动校验未通过(${p.reason}),已挂起`,
    });
  });
  if (o.amounts.paid > 0) {
    events.push({
      time: o.payTime,
      type: 'paid',
      title: '✓ 付款单校验通过',
      desc: '系统 · 自动校验通过,订单流转',
    });
  }
  events.push({
    time: o.orderTime,
    type: 'created',
    title: '订单创建',
    desc: `销售员·${o.sales} · 创建订单 <span class="mono">${o.orderNo}</span>,商品「${o.products[0].name}」`,
  });
  // 按时间倒序
  events.sort((a, b) => (b.time > a.time ? 1 : -1));

  return `
    <div class="timeline">
      ${events.map(e => {
        const dotCls = e.type === 'held' ? 'error' : (e.type === 'paid' ? 'success' : 'brand');
        const tagCls = e.type === 'held' ? 'tag-error' : (e.type === 'paid' ? 'tag-success' : 'tag-brand');
        return `
          <div class="timeline-item">
            <div class="timeline-dot ${dotCls}"></div>
            <div class="timeline-time">${e.time}</div>
            <div class="timeline-title"><span class="tag ${tagCls}">${e.title}</span></div>
            <div class="timeline-desc">${e.desc}</div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function showHeldModal(type, payNo) {

  let payDetail = null;
  if (payNo) {
    for (const ord of ORDERS) {
      if (ord.heldPayments) {
        const p = ord.heldPayments.find(x => x.payNo === payNo);
        if (p) { payDetail = { order: ord, payment: p }; break; }
      }

  const customerName = payDetail?.order?.user?.nick || '张三';
  const customerId = payDetail?.order?.user?.id || '1001';

  const payerCard = payDetail?.payment?.payerCard || '招商银行 6225 8870 1234 4421';
  // 姓名脱敏:中间字符全部替换为 *
  const maskName = (n) => {
    if (!n || n === '未识别') return n || '--';
    if (n.length <= 1) return n;
    if (n.length === 2) return n[0] + '*';
    return n[0] + '*'.repeat(n.length - 2) + n[n.length - 1];
  };
  const payerNameMasked = maskName(payerName);
  // 卡号脱敏:保留前 4 + 后 4,中间用 8 个 *
  const cardDigits = (payerCard.match(/\d/g) || []).join('');
  const payerCardMasked = cardDigits.length >= 8
    ? `${cardDigits.slice(0, 4)} **** **** ${cardDigits.slice(-4)}`
    : payerCard;
  const payerIdMasked = payDetail?.payment?.payerIdMasked || '130***********8765';

function closeModalById(id) {
  document.getElementById(id)?.classList.remove('show');
  setTimeout(() => {

}

<script>
// ====================================================================
// 财务模块 - 待确认款项
// ====================================================================

// 历史已处理的待确认款项(refunded / on_hold / whitelist)— 这些是过去的记录,不在订单挂起列表中
const FUNDS_HISTORY = [
  { no: 'PAY-K05', orderNo: 'SO...068742', customer: '陈某 (1022)', userId: '1022', payer: '陈某', card: '建设银行 6217****5566', amount: 36000, status: 'refunded', cancelTime: '04-15 11:00', duration: '已处理' },
  { no: 'PAY-K02', orderNo: 'SO...054128', customer: '孙某 (1030)', userId: '1030', payer: '孙妻', card: '招商银行 6225****3344', amount: 45800, status: 'on_hold', cancelTime: '04-08 16:00', duration: '29 天' },
  { no: 'PAY-K12', orderNo: 'SO...078234', customer: '周某 (1018)', userId: '1018', payer: '周妻', card: '招商银行 6225****7788', amount: 42000, status: 'whitelist', cancelTime: '04-22 18:00', duration: '已处理' },
  { no: 'PAY-K09', orderNo: 'SO...074219', customer: '赵某 (1025)', userId: '1025', payer: '赵父', card: '农业银行 6228****6699', amount: 39400, status: 'whitelist', cancelTime: '04-19 12:00', duration: '已处理' },
];

// 待确认款项数据 = 订单挂起付款单(pending) + 历史已处理(refunded / on_hold / whitelist)
// 这种结构确保「订单详情挂起警示条」与「待确认款项列表」对应同一条 payment_record
function buildFunds() {
  const pending = [];

  // 从 ORDERS 派生 pending 部分(这就是当前活跃的"挂起付款单"="待确认-待处理")
  if (typeof ORDERS !== 'undefined') {
    for (const o of ORDERS) {
      if (o.held && o.heldPayments) {
        for (const p of o.heldPayments) {
          // 简化卡号显示:招商银行 6225 8870 1234 4421 → 招商银行 6225****4421
          const cardShort = p.payerCard.replace(/(\d{4})[\s\d]+(\d{4})/, '$1****$2');
          pending.push({
            no: p.payNo,
            orderNo: 'SO...' + o.orderNo.slice(-6),
            orderNoFull: o.orderNo,
            customer: `${o.user.nick} (${o.user.id})`,
            userId: o.user.id,
            payer: p.payerName,
            card: cardShort,
            amount: p.amount,
            status: 'pending',
            cancelTime: p.paidAt.slice(5, 16),  // "MM-DD HH:MM"
            duration: p.duration,
          });
        }
      }
    }
  }

  return [...pending, ...FUNDS_HISTORY];
}

const FUNDS = buildFunds();

const FUND_STATUS = {
  pending: { text: '⏳ 待处理', cls: 'tag-warning' },
  refunded: { text: '⊘ 已退款', cls: 'tag-default' },
  on_hold: { text: '⏸ 暂时挂起观察', cls: 'tag-default' },
  whitelist: { text: '✓ 已通过加白处理', cls: 'tag-success' },
};

let fundFilter = 'all';
const fundFilterState = { userId: '', orderNo: '', dateRange: '' };

function getFundsByStatus(s) {
  let list = (s === 'all') ? FUNDS : FUNDS.filter(f => f.status === s);

  // 用户ID 精确/模糊匹配
  if (fundFilterState.userId) {
    const kw = fundFilterState.userId.trim();
    list = list.filter(f => (f.userId || '').includes(kw) || f.customer.includes(kw));
  }
  // 订单号 模糊匹配(支持完整号和缩写)
  if (fundFilterState.orderNo) {
    const kw = fundFilterState.orderNo.trim();
    list = list.filter(f => f.orderNo.includes(kw) || (f.orderNoFull || '').includes(kw));
  }
  // 时间范围:简单字符串匹配(用 cancelTime 字段如 "05-06 13:35")
  if (fundFilterState.dateRange) {
    // 接受格式如 "2026-05-01 → 2026-05-10" 或 "05-01 → 05-10"
    const m = fundFilterState.dateRange.match(/(\d{2,4}-\d{1,2}-\d{1,2}|\d{2}-\d{2})\s*[→~-]+\s*(\d{2,4}-\d{1,2}-\d{1,2}|\d{2}-\d{2})/);
    if (m) {
      // 简化版:用 MM-DD 比较(因为 mock 数据只有 MM-DD)
      const normalize = (s) => s.includes(',') ? s : s.slice(-5); // 取末尾 MM-DD
      const start = normalize(m[1]);
      const end = normalize(m[2]);
      list = list.filter(f => {
        const t = f.cancelTime.slice(0, 5); // "05-06 13:35" → "05-06"
        return t >= start && t <= end;
      });
    }
  }
  return list;
}

function applyFundFilter() {
  fundFilterState.userId = document.getElementById('fundFilterUserId')?.value || '';
  fundFilterState.orderNo = document.getElementById('fundFilterOrderNo')?.value || '';
  fundFilterState.dateRange = document.getElementById('fundFilterDateRange')?.value || '';
  goPage('funds-list');
  showToast('✓ 已应用筛选条件', 'success');
}

function resetFundFilter() {
  fundFilterState.userId = '';
  fundFilterState.orderNo = '';
  fundFilterState.dateRange = '';
  fundFilter = 'all';
  goPage('funds-list');
  showToast('已重置筛选', 'success');
}

        <div class="page-subtitle">客户在 C 端取消本次付款后产生的资金,管理员做最终处理:手动退款 / 暂时挂起观察 / 客户重新支付时通过加白名单自动归档。</div>

          <div class="summary-card-label">待处理</div>

      </div>

        </div>
      </div>

        <div class="summary-card-body">
          <div class="summary-card-value">${FUNDS.filter(f => f.status !== 'pending').length} 笔</div>
          <div class="summary-card-label">本月已处理</div>

      </div>

        </div>

          <input type="text" placeholder="输入关联订单号" id="fundFilterOrderNo" value="${fundFilterState.orderNo || ''}">
        </div>
        <div class="filter-item">
          <div class="filter-item-label">时间范围:</div>
          <input type="text" placeholder="开始日期 → 结束日期(YYYY-MM-DD)" id="fundFilterDateRange" value="${fundFilterState.dateRange || ''}">
        </div>
      </div>
      <div class="filter-actions">
        <button class="btn" onclick="resetFundFilter()">重置</button>
        <button class="btn primary" onclick="applyFundFilter()">查询</button>
      </div>
    </div>

    <div class="card">
      <div class="list-toolbar-tabs">
        ${['all', 'pending', 'refunded', 'on_hold', 'whitelist'].map(s => {
          const labels = { all: '全部', pending: '⏳ 待处理', refunded: '⊘ 已退款', on_hold: '⏸ 暂时挂起观察', whitelist: '✓ 已通过加白处理' };
          // 计数考虑当前搜索筛选条件
          const cnt = getFundsByStatus(s).length;
          return `<div class="tab-item ${fundFilter === s ? 'active' : ''}" onclick="filterFundStatus('${s}')">${labels[s]}<span class="num">${cnt}</span></div>`;
        }).join('')}
      </div>

      <table class="data-table">

        <tbody>
          ${list.length === 0 ? `

          ` : list.map(f => {

                <td class="mono">${f.cancelTime}</td>
                <td><span style="color:${f.status === 'pending' && parseInt(f.duration) > 7 ? 'var(--error)' : 'var(--text-3)'};font-size:12px;">${f.duration}</span></td>

};

let selectedFundMethod = null;
function selectFundMethod(el, method) {
  document.querySelectorAll('.method-option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  selectedFundMethod = method;
  document.getElementById('refundReasonRow').style.display = method === 'refund' ? 'block' : 'none';
}
function submitFundProcess() {
  if (!selectedFundMethod) { showToast('请选择处理方式', 'error'); return; }
  closeModalById('modalFundProcess');
  showToast(selectedFundMethod === 'refund' ? '✓ 已创建退款工单,等待财务审核' : '✓ 已标记为暂时挂起观察', 'success');
}

function showInvalidatePayerModal(btn) {
  const card = btn.closest('.payer-card');
  const payerName = card?.querySelector('.payer-card-name')?.childNodes[0]?.textContent?.trim() || '该付款人';

  let container = document.getElementById('temp-modal-container');
  if (!container) { container = document.createElement('div'); container.id = 'temp-modal-container'; document.body.appendChild(container); }
  container.innerHTML = `
    <div class="modal-mask show" id="modalInvalidatePayer">
      <div class="modal" style="width: 460px;">
        <div class="modal-header">
          <div class="modal-title">设为失效 · ${payerName}</div>
          <button class="modal-close" onclick="closeModalById('modalInvalidatePayer')">×</button>
        </div>
        <div class="modal-body">
          <div class="alert error">
            <strong>⚠️ 注意</strong>
            <div style="margin-top: 6px; line-height: 1.6;">
              失效后,「<strong>${payerName}</strong>」的所有银行卡将不再用于自动校验。
              该付款人记录会保留(用于历史订单追溯),但状态变为「已失效」。
              <br><br>
              <strong>不会影响</strong>:已通过校验的历史订单。<br>
              <strong>会影响</strong>:此后该付款人代付,将再次触发挂起。
            </div>
          </div>
          <div class="form-row">
            <label class="form-label">失效原因 <span style="color:var(--text-3);font-weight:400;">(选填,留底备查)</span></label>
            <textarea class="form-textarea" placeholder="如:客户告知该付款人不再使用 / 客户解除授权"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn" onclick="closeModalById('modalInvalidatePayer')">取消</button>
          <button class="btn danger" onclick="submitInvalidatePayer('${payerName}')">确认失效</button>
        </div>
      </div>
    </div>
  `;
}

function submitInvalidatePayer(payerName) {
  closeModalById('modalInvalidatePayer');
  showToast('✓ 付款人「' + payerName + '」已设为失效', 'success');
}

  container.innerHTML = `
    <div class="modal-mask show" id="modalRestorePayer">
      <div class="modal" style="width: 460px;">
        <div class="modal-header">
          <div class="modal-title">恢复付款人 · ${payerName}</div>
          <button class="modal-close" onclick="closeModalById('modalRestorePayer')">×</button>
        </div>
        <div class="modal-body">
          <div class="alert brand">
            <strong>💡 恢复操作</strong>
            <div style="margin-top: 6px; line-height: 1.6;">
              恢复后,「<strong>${payerName}</strong>」会重新生效,其名下所有银行卡可用于自动校验。
              <br><br>
              <strong>会影响</strong>:此后该付款人代付,系统自动通过校验。
            </div>
          </div>
          <div class="form-row">
            <label class="form-label">恢复原因 <span style="color:var(--text-3);font-weight:400;">(选填,留底备查)</span></label>
            <textarea class="form-textarea" placeholder="如:客户告知关系恢复 / 重新授权"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn" onclick="closeModalById('modalRestorePayer')">取消</button>
          <button class="btn primary" onclick="closeModalById('modalRestorePayer'); showToast('✓ 付款人「${payerName}」已恢复生效', 'success');">确认恢复</button>
        </div>
      </div>
    </div>
  `;
}

// 永久删除已失效的付款人
function showDeletePayerModal(btn) {
  const card = btn.closest('.payer-card');
  const payerName = card?.querySelector('.payer-card-name')?.childNodes[0]?.textContent?.trim() || '该付款人';

  let container = document.getElementById('temp-modal-container');
  if (!container) { container = document.createElement('div'); container.id = 'temp-modal-container'; document.body.appendChild(container); }
  container.innerHTML = `
    <div class="modal-mask show" id="modalDeletePayer">
      <div class="modal" style="width: 460px;">
        <div class="modal-header">
          <div class="modal-title">永久删除 · ${payerName}</div>
          <button class="modal-close" onclick="closeModalById('modalDeletePayer')">×</button>
        </div>
        <div class="modal-body">
          <div class="alert error">
            <strong>⚠️ 此操作不可恢复</strong>
            <div style="margin-top: 6px; line-height: 1.6;">
              永久删除后,付款人「<strong>${payerName}</strong>」的记录将从系统移除,无法找回。
              <br><br>
              <strong>建议</strong>:仅在数据录入错误等场景下使用。如客户告知不再代付,使用「失效」即可保留历史数据。
              <br><br>
              <strong>历史订单</strong>:该付款人关联的历史订单不受影响,但订单详情中的付款人信息将显示为「已删除」。
            </div>
          </div>
          <div class="form-row">
            <label class="form-label"><span class="required">*</span>删除原因</label>
            <select class="form-select">
              <option value="">请选择</option>
              <option>录入错误</option>
              <option>客户要求删除</option>
              <option>其他</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn" onclick="closeModalById('modalDeletePayer')">取消</button>
          <button class="btn danger" onclick="closeModalById('modalDeletePayer'); showToast('✓ 付款人「${payerName}」已永久删除', 'success');">确认永久删除</button>
        </div>
      </div>
    </div>
  `;
}

function showEditPayerModal() {
  let container = document.getElementById('temp-modal-container');
  if (!container) { container = document.createElement('div'); container.id = 'temp-modal-container'; document.body.appendChild(container); }
  container.innerHTML = `
    <div class="modal-mask show" id="modalEditPayer">
      <div class="modal" style="width: 480px;">
        <div class="modal-header">
          <div class="modal-title">编辑付款人信息</div>
          <button class="modal-close" onclick="closeModalById('modalEditPayer')">×</button>

        <div class="modal-body">
          <div class="alert warning">⚠️ 姓名 / 证件号不可修改。可修改关系 / 备注、增 / 删 / 改银行卡号。</div>
          <div class="form-row"><label class="form-label">打款人姓名</label><input type="text" class="form-input" value="刘父亲" readonly style="background:var(--bg-secondary);"></div>
          <div class="form-row"><label class="form-label">身份证号</label><input type="text" class="form-input mono" value="110***********1234" readonly style="background:var(--bg-secondary);"></div>
          <div class="form-row"><label class="form-label"><span class="required">*</span>银行卡列表 <span style="color:var(--text-3);font-weight:400;font-size:12px;">(至少保留 1 张)</span></label>
            <div id="editPayerCardList">
              <div class="edit-card-row" style="display:flex;gap:8px;margin-bottom:8px;align-items:center;">
                <select class="form-select" style="width:120px;flex-shrink:0;">${bankOptionsHtml('交通银行')}</select>
                <input type="text" class="form-input mono" value="6222 6012 3456 1188">
                <button class="btn sm" onclick="confirmDeletePayerCard(this)" style="flex-shrink:0;">删除</button>
              </div>
              <div class="edit-card-row" style="display:flex;gap:8px;margin-bottom:8px;align-items:center;">
                <select class="form-select" style="width:120px;flex-shrink:0;">${bankOptionsHtml('招商银行')}</select>
                <input type="text" class="form-input mono" value="6225 8801 4477 1188">
                <button class="btn sm" onclick="confirmDeletePayerCard(this)" style="flex-shrink:0;">删除</button>
              </div>
            </div>
            <button class="btn sm" style="margin-top:4px;" onclick="addPayerCardRow()">+ 添加银行卡号</button>
          </div>
          <div class="form-row"><label class="form-label"><span class="required">*</span>关系</label>
            <select class="form-select"><option>亲属</option><option>公司财务</option><option>公司法人</option><option>其他</option></select>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn" onclick="closeModalById('modalEditPayer')">取消</button>
          <button class="btn primary" onclick="closeModalById('modalEditPayer'); showToast('✓ 已保存修改', 'success');">保存</button>
        </div>
      </div>
    </div>
  `;
}

// 删除银行卡号 - 弹二次确认
function confirmDeletePayerCard(btn) {
  const row = btn.closest('.edit-card-row');
  const list = document.getElementById('editPayerCardList');
  if (!row || !list) return;

  // 至少保留 1 张
  const remaining = list.querySelectorAll('.edit-card-row').length;
  if (remaining <= 1) {
    showToast('至少保留 1 张银行卡', 'error');
    return;
  }

  // 提取卡号显示在确认框
  const cardNo = row.querySelector('input')?.value || '该卡号';
  const bankName = row.querySelector('select')?.value || '';

  // 二次确认
  let container = document.getElementById('temp-modal-container-2');
  if (!container) { container = document.createElement('div'); container.id = 'temp-modal-container-2'; document.body.appendChild(container); }
  // 给行加唯一 id 用于回调
  if (!row.dataset.delMark) row.dataset.delMark = 'del-' + Date.now();
  const mark = row.dataset.delMark;

  container.innerHTML = `
    <div class="modal-mask show" id="modalDelCard" style="z-index: 250;">
      <div class="modal" style="width: 420px;">
        <div class="modal-header">
          <div class="modal-title">确认删除银行卡</div>
          <button class="modal-close" onclick="closeDelCardModal()">×</button>
        </div>
        <div class="modal-body">
          <div class="alert warning">
            <div style="line-height:1.6;">
              确认删除该银行卡号?<br>
              <strong>${bankName}</strong> · <span class="mono">${cardNo}</span><br><br>
              删除后,该卡号将不再用于自动校验。后续以该卡号付款的订单会触发挂起。
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn" onclick="closeDelCardModal()">取消</button>
          <button class="btn danger" onclick="doDeletePayerCard('${mark}')">确认删除</button>
        </div>
      </div>
    </div>
  `;
}

function closeDelCardModal() {
  document.getElementById('modalDelCard')?.classList.remove('show');
  setTimeout(() => {
    const c = document.getElementById('temp-modal-container-2');
    if (c) c.innerHTML = '';
  }, 300);
}

function doDeletePayerCard(mark) {
  const row = document.querySelector('.edit-card-row[data-del-mark="' + mark + '"]');
  if (row) row.remove();
  closeDelCardModal();
  showToast('✓ 银行卡已删除', 'success');
}

// 添加银行卡号
function addPayerCardRow() {
  const list = document.getElementById('editPayerCardList');
  if (!list) return;
  const row = document.createElement('div');
  row.className = 'edit-card-row';
  row.style.cssText = 'display:flex;gap:8px;margin-bottom:8px;align-items:center;';
  row.innerHTML = `
    <select class="form-select" style="width:120px;flex-shrink:0;">${bankOptionsHtml()}</select>
    <input type="text" class="form-input mono" placeholder="请输入银行卡号">
    <button class="btn sm" onclick="confirmDeletePayerCard(this)" style="flex-shrink:0;">删除</button>
  `;
  list.appendChild(row);
}
</script>
