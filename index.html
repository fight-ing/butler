<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Butler - 示例集合</title>
<style>
* {box-sizing: border-box; margin: 0; padding: 0;}
body {background: #f5f5f5; min-height: 100vh; padding: 40px 20px; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;}
.container {max-width: 800px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 32px; box-shadow: 0 4px 24px rgba(0,0,0,.12);}
h1 {font-size: 28px; color: #1a1a1a; margin-bottom: 8px;}
p {color: #666; font-size: 15px; margin-bottom: 32px;}
.list {display: grid; gap: 16px;}
.item {display: block; padding: 20px; border: 1px solid #e0e0e0; border-radius: 12px; text-decoration: none; transition: all .2s;}
.item:hover {border-color: #1677ff; background: #f5faff; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(22, 119, 255, .15);}
.item h3 {font-size: 18px; color: #1a1a1a; margin-bottom: 6px;}
.item p {color: #999; font-size: 13px; margin-bottom: 0;}
</style>
</head>
<body>
<div class="container">
  <h1>Butler 示例集合</h1>
  <p>所有 HTML 示例，点击可直接预览</p>
  <div class="list">
    <a href="booking-time-picker.html" class="item">
      <h3>预约时间选择器</h3>
      <p>带日期选择、时段时长配置、不可预约冲突检测的时间选择器</p>
    </a>
  </div>
</div>
</body>
</html>
